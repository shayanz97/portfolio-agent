[project]
name = "portfolio-agent"
version = "0.8.0"
description = "LangGraph-based portfolio monitoring and paper-trading agent"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "PyYAML>=6.0,<7",
    "SQLAlchemy>=2.0,<3",
    "langgraph>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
